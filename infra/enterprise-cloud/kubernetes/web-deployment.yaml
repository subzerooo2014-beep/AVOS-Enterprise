apiVersion: apps/v1
kind: Deployment
metadata:
  name: avos-web
  namespace: avos-enterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avos-web
  template:
    metadata:
      labels:
        app: avos-web
    spec:
      containers:
        - name: avos-web
          image: avos-enterprise/web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://avos-api:3000
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: avos-web
  namespace: avos-enterprise
spec:
  selector:
    app: avos-web
  ports:
    - port: 80
      targetPort: 3000